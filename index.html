<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src *">
  <title>Open Crow</title>
  <link rel="icon" type="image/png" href="./assets/icon.png">
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="titlebar-brand">
        <img src="./assets/icon.png" alt="" class="titlebar-logo">
        <span>Open Crow</span>
      </div>
      <div class="window-controls">
        <button id="btnMinimize" class="win-btn" title="Küçült" aria-label="Küçült">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button id="btnMaximize" class="win-btn" title="Büyüt" aria-label="Büyüt">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button id="btnClose" class="win-btn win-btn-close" title="Kapat" aria-label="Kapat">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar">
        <button id="btnNewChat" class="new-chat" type="button">
          <svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Yeni sohbet
        </button>
        <div class="session-groups" id="sessionList"></div>
        <button id="btnOpenSettings" class="side-footer" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Ayarlar
        </button>
      </aside>

      <main class="chat">
        <header class="chat-header">
          <h1 class="chat-title" id="chatTitle">Yeni sohbet</h1>
          <div class="chat-controls">
            <button type="button" class="workspace-btn" id="workspaceBtn" title="Çalışma klasörü seç">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span id="workspaceName">Klasör seç</span>
            </button>
            <label class="picker">
              <span class="sr-only">Onay modu</span>
              <select id="modeSelect" title="Araç onay modu">
                <option value="ask">Her değişikliği sor</option>
                <option value="edits">Düzenlemeleri otomatik onayla</option>
                <option value="auto">Her şeyi otomatik onayla</option>
              </select>
            </label>
            <label class="picker">
              <span class="sr-only">Model</span>
              <select id="modelSelect" title="Model seç"></select>
            </label>
          </div>
        </header>

        <div class="messages" id="messages">
          <div class="empty" id="emptyState">
            <div class="empty-mark">›_</div>
            <h2>Ne üzerinde çalışıyoruz?</h2>
            <p id="emptyCopy">Önce bir çalışma klasörü seç; ardından dosyaları okuyup düzenleyebilirim.</p>
            <div class="suggestions">
              <button type="button" class="suggestion" data-prompt="Bu kodu nasıl daha okunur hale getirebilirim? Adımları anlat.">Kod okunabilirliğini artır</button>
              <button type="button" class="suggestion" data-prompt="Bir hata mesajını birlikte inceleyelim. Ne bilgiye ihtiyacın var?">Hata ayıklamaya yardım et</button>
              <button type="button" class="suggestion" data-prompt="Bu proje için kısa bir yol haritası çıkar.">Yol haritası çıkar</button>
            </div>
          </div>
        </div>

        <div class="notice" id="notice" hidden></div>

        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Bir şey yaz… (Enter gönderir, Shift+Enter yeni satır)"></textarea>
          <button type="submit" id="sendBtn" class="send-btn" title="Gönder" aria-label="Gönder">
            <svg id="iconSend" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg id="iconStop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>
        </form>
      </main>
    </div>

    <div class="overlay" id="settingsOverlay" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="modal-header">
          <h2 id="settingsTitle">Sağlayıcı ayarları</h2>
          <button type="button" class="win-btn" id="btnCloseSettings" aria-label="Kapat">
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </header>
        <p class="modal-hint">OpenAI uyumlu herhangi bir sağlayıcı çalışır. Anahtar yalnızca bu bilgisayarda saklanır.</p>
        <form id="settingsForm" class="modal-form">
          <label class="field">
            <span>API adresi</span>
            <input id="setBaseUrl" type="url" placeholder="https://api.openai.com/v1" autocomplete="off" spellcheck="false">
          </label>
          <label class="field">
            <span>API anahtarı</span>
            <input id="setApiKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
          </label>
          <div class="modal-status" id="settingsStatus" role="status"></div>
          <div class="modal-actions">
            <button type="button" class="btn-ghost" id="btnClearSettings">Bilgileri sil</button>
            <button type="submit" class="btn-primary">Kaydet</button>
          </div>
        </form>
      </section>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
