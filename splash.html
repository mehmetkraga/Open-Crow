<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Crow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      width: 520px;
      height: 320px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-card {
      width: 520px;
      height: 320px;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #08080a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.95), 0 0 1px rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 34px;
    }
    /* Minimalist monochrome ambient glow */
    .splash-glow {
      position: absolute;
      top: -80px;
      right: -60px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 45%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(20px);
    }
    .splash-subtle-mesh {
      position: absolute;
      bottom: -60px;
      left: -40px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 65%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(16px);
    }
    /* Top bar */
    .splash-top {
      display: flex;
      justify-content: flex-end;
      position: relative;
      z-index: 10;
    }
    .splash-close-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .splash-close-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    /* Main Branding */
    .splash-brand {
      display: flex;
      align-items: center;
      gap: 22px;
      position: relative;
      z-index: 10;
      margin-top: 6px;
    }
    .splash-logo-card {
      width: 68px;
      height: 68px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }
    .splash-logo-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.25));
    }
    .splash-title-wrap {
      display: flex;
      flex-direction: column;
    }
    .splash-app-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      gap: 8px;
      line-height: 1.1;
    }
    .splash-app-title span {
      font-weight: 600;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.5px;
    }
    .splash-tagline {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 500;
      letter-spacing: 0.2px;
      margin-top: 6px;
    }
    /* Bottom Section */
    .splash-bottom {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .splash-progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .splash-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.4) 30%, #ffffff 50%, rgba(255, 255, 255, 0.4) 70%, transparent 100%);
      border-radius: 3px;
      animation: progressMove 1.6s infinite ease-in-out;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.75);
    }
    @keyframes progressMove {
      0% { left: -30%; width: 30%; }
      50% { width: 45%; }
      100% { left: 100%; width: 25%; }
    }
    .splash-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .splash-status-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
      letter-spacing: 0.2px;
      font-family: var(--font-ui);
    }
    .splash-year-badge {
      font-size: 20px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.5px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="splash-glow"></div>
    <div class="splash-subtle-mesh"></div>

    <div class="splash-top">
      <button class="splash-close-btn" id="btnCloseSplash" title="Kapat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="splash-brand">
      <div class="splash-logo-card">
        <img src="./assets/images/logo-bird.png" alt="Open Crow" class="splash-logo-img">
      </div>
      <div class="splash-title-wrap">
        <h1 class="splash-app-title">KRAGA <span>IDE</span></h1>
        <p class="splash-tagline">Otonom AI & Tam Donanımlı Geliştirme Ortamı</p>
      </div>
    </div>

    <div class="splash-bottom">
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
      <div class="splash-info-row">
        <span class="splash-status-text" id="splashStatus">Çekirdek mimari başlatılıyor...</span>
        <span class="splash-year-badge">2026</span>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('splashStatus');
    const messages = [
      'Çekirdek mimari başlatılıyor...',
      'Akıllı ajan motoru yükleniyor...',
      'Model kataloğu ve araçlar taranıyor...',
      'Çalışma alanı hazırlanıyor...',
      'Hazır!'
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      if (statusEl) statusEl.textContent = messages[idx];
    }, 450);

    document.getElementById('btnCloseSplash')?.addEventListener('click', () => {
      window.close();
    });
  </script>
</body>
</html>
